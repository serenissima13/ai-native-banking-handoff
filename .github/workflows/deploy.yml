# Publishes the demo and the Storybook to GitHub Pages on every push to main:
#   /            → the demo (npm run build)
#   /storybook/  → the Storybook (npm run build-storybook)
# The stories run as tests first (Vitest + Playwright): a change that breaks the chip never reaches the public links.
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
name: Deploy demo and Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test every story (interactions, CSS check, a11y panel data)
        run: npx vitest --project storybook run
      - run: npm run build
      - run: npm run build-storybook -- --output-dir dist/storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
