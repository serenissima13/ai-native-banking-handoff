# Runs every story as a test, then publishes the demo and the Storybook to GitHub Pages on every
# push to main. A change that breaks the chip stops here, before it ships.
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
# Demo:      https://<org>.github.io/<repo>/
# Storybook: https://<org>.github.io/<repo>/storybook/
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vitest --project storybook run
      - run: npm run build
      # Storybook builds with relative asset paths, so it nests cleanly under /storybook/ in the
      # same Pages deployment — no extra GitHub Pages site or base-path config needed.
      - run: npm run build-storybook
      - run: mv storybook-static dist/storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
